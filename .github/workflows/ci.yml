name: CI

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test (offline unit tests)
        run: pytest tests/ -q
      - name: No em-dash and no emoji in tracked content (ADR-0067)
        run: python scripts/check_content_standards.py
      - name: Build check
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*
